#version: '3.8'

networks:
  fb98_network:
    driver: bridge

services:
  fb98.bootstrapper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=fb98db;Username=postgres;Password=yourpassword
    depends_on:
      - db
    networks:
      - fb98_network
    volumes:
      - app_data:/app/data

  db:
    image: postgres:15
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres # can change
      POSTGRES_PASSWORD: yourpassword # can change
      POSTGRES_DB: fb98db
    networks:
      - fb98_network
    volumes:
      - db_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # can change
      PGADMIN_DEFAULT_PASSWORD: admin # can change
    depends_on:
      - db
    networks:
      - fb98_network
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: myuser # can change
      RABBITMQ_DEFAULT_PASS: mypassword # can change
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
volumes:
  rabbitmq_data:
  rabbitmq_logs:
  app_data:
  db_data:
