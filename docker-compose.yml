networks:
  fb98_network:
    driver: bridge

services:
  fb98.bootstrapper:
    image: bkhang1227/fb98:bootstrapper
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000" #http 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development  
      - Redis__ConnectionString=redis:6379,password=your_secure_password,abortConnect=false,connectTimeout=1000
      - ConnectionStrings__RabbitMq=amqp://myuser:mypassword@rabbitmq:5672/
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=fb98db;Username=postgres;Password=yourpassword
    depends_on:
      - rabbitmq
      - db
      - redis
    networks:
      - fb98_network
    volumes:
      - app_data:/app/data

  db:
    image: bkhang1227/fb98:database
    #image: postgres:15
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres # can change
      POSTGRES_PASSWORD: yourpassword # can change
      POSTGRES_DB: fb98db
    networks:
      - fb98_network
    volumes:
      - db_data:/var/lib/postgresql/data
  pgadmin:
    image: bkhang1227/fb98:pgadmin
    #image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # can change
      PGADMIN_DEFAULT_PASSWORD: admin # can change
    depends_on:
      - db
    networks:
      - fb98_network
  rabbitmq:
    hostname: rabbitmq
    healthcheck:
        test: ["CMD", "rabbitmqctl", "status"]
        interval: 10s
        timeout: 5s
        retries: 3
    image: bkhang1227/fb98:rabbitmq
    # image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
      RABBITMQ_DEFAULT_VHOST: vhost
    networks:
      - fb98_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
  redis:
    image: bkhang1227/fb98:redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - fb98_network
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=your_secure_password
    command: ["redis-server", "--requirepass", "your_secure_password", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  rabbitmq_data:
  rabbitmq_logs:
  redis_data:
  app_data:
  db_data: