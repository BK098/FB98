name: CICD Pipeline

on:
    push:
        branches:
        - release
    pull_request:
        branches:
        - release

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up .NET
              uses: actions/setup-dotnet@v3
              with:
                dotnet-version: '8.0.x'

            - name: Restore dependencies
              run: dotnet restore FB98.sln

            - name: Build
              run: dotnet build FB98.sln --no-restore

    build-and-deploy:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/release'

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Docker
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and Push Docker image
              run: |
                 docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/fb98:latest -f Dockerfile .
                 docker push ${{ secrets.DOCKER_HUB_USERNAME }}/fb98:latest

            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: 22
                  script_stop: true
                  debug: true
                  use_insecure_cipher: true
                  script: |
                    cd /fb98
                    cd FB98
                    git pull origin release
                    docker-compose pull
                    docker-compose down bootstrapper
                    docker-compose up -d
                    docker system prune -f

            - name: Health Check
              run: |
                sleep 30
                curl -f http://${{ secrets.VPS_HOST }}:5000/catelog-module || exit 1
    
